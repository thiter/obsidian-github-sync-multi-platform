name: Build plugin

# 触发条件配置
on:
  push:
    # 针对 master 分支的普通提交也触发
    branches:
      - "master"
    tags:
      - "*"
    paths:
      - "manifest.json"
  # 支持手动触发（用于补发历史遗漏版本或重跑）
  workflow_dispatch:
# 权限配置：允许脚本写入仓库内容（用于发布 Release）
permissions:
  contents: write

env:
  NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }} # 明确 checkout 触发 workflow 的分支
          # 获取所有历史记录，为了确保能获取到 git tags
          fetch-depth: 0 # Required to fetch tags

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      # 核心逻辑：检查版本号变更
      - name: Check Version
        id: check_version
        run: |
          CURRENT_VERSION=$(jq -r .version manifest.json)
          echo "Current manifest version: $CURRENT_VERSION"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 手动打 tag 触发，直接发布
            echo "Triggered by tag ${{ github.ref_name }}. Proceeding."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # 以「最新已发布 Release 的 tag」为基准，而不是 HEAD~1。
            # 这样即使版本变更不在最后一个提交里，也不会漏发。
            LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name // empty')
            LAST_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
            [ -z "$LAST_VERSION" ] && LAST_VERSION="0.0.0"
            echo "Latest released version: $LAST_VERSION"

            HIGHER_VERSION=$(printf '%s\n%s\n' "$LAST_VERSION" "$CURRENT_VERSION" | sort -V | tail -n 1)
            if [ "$CURRENT_VERSION" != "$LAST_VERSION" ] && [ "$HIGHER_VERSION" = "$CURRENT_VERSION" ]; then
              echo "New version detected: $LAST_VERSION -> $CURRENT_VERSION"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "release_tag=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            else
              echo "No new version (latest=$LAST_VERSION, current=$CURRENT_VERSION). Skipping."
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Prepare Commit Message
        id: prepare
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          # 获取提交文本信息
          msg=$(git log -1 --pretty=%B)

          # 设置 Python 进行翻译
          pip install deep-translator > /dev/null 2>&1 || true

          # 运行翻译脚本
          export COMMIT_MSG="$msg"

          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          if [ -f "scripts/translate_commit.py" ]; then
              python3 scripts/translate_commit.py >> $GITHUB_OUTPUT
          else
              echo "未找到翻译脚本，使用原始消息"
              echo "$msg" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Build
        id: build
        # 只有在 check_version 步骤输出 should_release 为 true 时才执行
        if: steps.check_version.outputs.should_release == 'true'
        run: |

          pnpm install
          pnpm run build
          mkdir ${{ env.NAME }}
          cp main.js manifest.json styles.css ${{ env.NAME }}
          zip -r ${{ env.NAME }}-v${{ steps.check_version.outputs.release_tag }}.zip ${{ env.NAME }}
          ls
          # 设置输出变量 tag_name
          echo "tag_name=${{ steps.check_version.outputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.release_tag }}
          name: ${{ steps.check_version.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.prepare.outputs.commit_msg }}
          target_commitish: ${{ github.sha }} # 明确指定在当前分支的 commit 上创建 tag
          overwrite_files: true
          files: |
            ${{ env.NAME }}-v${{ steps.check_version.outputs.release_tag }}.zip
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把本次 GitHub Release 镜像到 CNB：同名 tag + 同样的附件
      - name: Mirror Release to CNB
        if: steps.check_version.outputs.should_release == 'true'
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_SLUG: weiguanghui/chunmiao/obsidian-github-sync-multi-platform-cnb
          TAG: ${{ steps.check_version.outputs.release_tag }}
          NAME: ${{ env.NAME }}
          BODY: ${{ steps.prepare.outputs.commit_msg }}
          FILES: ${{ env.NAME }}-v${{ steps.check_version.outputs.release_tag }}.zip main.js manifest.json styles.css
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "未配置 CNB_TOKEN secret，跳过 CNB 镜像"
            exit 0
          fi
          # 1) 先同步 commit 与 tag 到 CNB —— Release 必须挂在真实 tag 上才会持久
          #    注意：tag 是软 props 在远程创建的，runner 本地没有该 tag，
          #    所以用 HEAD:refs/tags/<TAG> 直接构造，避免 src refspec 不存在。
          CNB_URL="https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_SLUG}.git"
          git push -f "$CNB_URL" "HEAD:refs/heads/master" "HEAD:refs/tags/${TAG}"
          # 2) 创建同名 Release 并上传同样附件
          bash scripts/cnb-mirror-release.sh


